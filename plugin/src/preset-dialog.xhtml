<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>Configure preset - Zotero RAG</title>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="chrome://zotero-rag/content/preset-dialog.css"/>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      try {
        Services.scriptloader.loadSubScript("chrome://zotero/content/include.js", this);
      } catch (e) {
        console.error("Failed to load include.js:", e);
      }
      for (const script of ["preset-dialog-view.js", "preset-dialog.js"]) {
        try {
          Services.scriptloader.loadSubScript(`chrome://zotero-rag/content/${script}`, window);
        } catch (e) {
          console.error(`Failed to load ${script}:`, e);
        }
      }
    });
  </script>
</head>
<body>
  <div id="pd-root"></div>
  <div class="pd-buttons">
    <button id="pd-close" type="button" class="pd-button">Close</button>
  </div>
</body>
</html>
