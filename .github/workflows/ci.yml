name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for backend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: changes
    # Only run if backend files changed
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install spaCy model
        run: uv pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      - name: Run unit tests
        run: uv run pytest backend/tests/ -v

  build-plugin:
    name: Build Plugin
    runs-on: ubuntu-latest
    needs: [changes, test]
    # Run if test passed OR if test was skipped (no backend changes)
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build plugin XPI
        run: python scripts/build_plugin.py

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-rag-plugin-ci
          path: plugin/dist/*.xpi
          retention-days: 7

  release:
    name: Release
    needs: [test, build-plugin]
    # Only on a direct push to main, once tests (if they ran) and the plugin
    # build both succeeded. Calling this as a reusable workflow (rather than
    # the old workflow_run trigger on release.yml) keeps it in this same push
    # event's context, so github.ref is correctly refs/heads/main for
    # semantic-release's branch detection — see release.yml's top comment.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.build-plugin.result == 'success'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
